name = "canteen"
version = "0.1.0"
defaultTargets = ["Canteen", "Audit"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The library itself: core language, examples and tests.
[[lean_lib]]
name = "Canteen"

# Runs the axiom/sorry audit over everything in `Canteen` on every build.
[[lean_lib]]
name = "Audit"
